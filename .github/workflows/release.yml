name: Build and Release Example

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install paperlet package
        run: make install

      - name: Build example
        working-directory: example
        run: typst compile --font-path ../font example.typ example.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-pdf
          path: example/example.pdf

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automated build from ${{ github.sha }}
          files: example/example.pdf
          make_latest: 'true'
