name: Build and publish example paper

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - name: Install paperlet package
        run: make install

      - name: Build example paper
        working-directory: example
        run: typst compile --font-path ../font example.typ example.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-pdf
          path: example/example.pdf

      # Moves the `latest` release (and its tag) to this commit, so
      # https://github.com/<repo>/releases/download/latest/example.pdf
      # always serves the newest build.
      - name: Publish rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest example/example.pdf \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Example paper built from $GITHUB_SHA." \
            --latest
